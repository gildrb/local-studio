name: GPUI
on:
  pull_request:
    paths:
      - apps/native/**
      - packages/app-core/**
      - .github/workflows/gpui.yml
  push:
    branches: [dev, main]
    paths:
      - apps/native/**
      - packages/app-core/**
      - .github/workflows/gpui.yml
permissions:
  contents: read
concurrency:
  group: gpui-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true
jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npx tsc --noEmit -p tsconfig.json
        working-directory: packages/app-core
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/native
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            libxkbcommon-dev \
            libasound2-dev \
            libudev-dev \
            libfontconfig1-dev
      - name: rustfmt
        working-directory: apps/native
        run: cargo fmt --check
      - name: clippy
        working-directory: apps/native
        run: cargo clippy -- -D warnings
      - name: build
        working-directory: apps/native
        run: cargo build
