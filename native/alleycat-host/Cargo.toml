[package]
name = "alleycat-host"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[[bin]]
name = "alleycat-host"
path = "src/main.rs"

[dependencies]
futures-util = { version = "0.3", default-features = false, features = [
  "std",
  "sink",
  "async-await",
] }
iroh = "1.5.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = [
  "io-std",
  "io-util",
  "macros",
  "net",
  "rt-multi-thread",
  "signal",
  "sync",
  "time",
] }
tokio-tungstenite = "0.30"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = true
