[workspace]
resolver = "2"
members = ["core", "kit"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
local-studio-core = { path = "core" }
eukhe-client = { path = "../eukhe/crates/eukhe-client" }
eukhe-types = { path = "../eukhe/crates/eukhe-types" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "process", "io-util", "fs"] }
uniffi = "0.32.2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
ignore = "0.4"
libghostty-vt = { version = "0.2.2", default-features = false }
notify = "8"
portable-pty = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
syntect = { version = "5.3", default-features = false, features = ["parsing", "regex-fancy"] }
two-face = { version = "0.5", default-features = false, features = ["syntect-fancy"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
module_name_repetitions = "allow"
missing_errors_doc = "allow"

[profile.dev.package.libghostty-vt-sys]
opt-level = 3
debug = false

[profile.release]
lto = "thin"
codegen-units = 4

[profile.dev.package.syntect]
opt-level = 3

[profile.dev.package.fancy-regex]
opt-level = 3

[profile.dev.package.regex-automata]
opt-level = 3

[profile.dev.package.regex-syntax]
opt-level = 3

[profile.dev.package.bincode]
opt-level = 3

[profile.dev.package.miniz_oxide]
opt-level = 3
