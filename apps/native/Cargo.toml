[package]
name = "local-studio-gpui"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
gpui = { package = "gpui-kit", version = "=0.7.3", features = [
  "tree-sitter",
  "tree-sitter-bash",
  "tree-sitter-css",
  "tree-sitter-diff",
  "tree-sitter-go",
  "tree-sitter-html",
  "tree-sitter-javascript",
  "tree-sitter-markdown",
  "tree-sitter-markdown-inline",
  "tree-sitter-python",
  "tree-sitter-rust",
  "tree-sitter-toml",
  "tree-sitter-tsx",
  "tree-sitter-typescript",
  "tree-sitter-yaml",
] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
dirs = "6.0.0"
futures = "0.3.34"
getrandom = "0.3"
alacritty_terminal = { version = "0.26.0", default-features = false }
qrcode = { version = "0.14", default-features = false }
image = { version = "0.25", default-features = false, features = ["jpeg"] }
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
url = "2.5"
rustls = { version = "0.23", default-features = false, features = [
  "ring",
  "std",
  "tls12",
  "logging",
] }
rustls-native-certs = "0.8"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
signal-hook = "0.3"

[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
wry = { version = "0.57.1", features = ["devtools"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6.4"
objc2-foundation = { version = "0.3.2", features = [
  "NSArray",
  "NSBundle",
  "NSData",
  "NSDate",
  "NSDictionary",
  "NSError",
  "NSGeometry",
  "NSHTTPCookie",
  "NSSet",
  "NSString",
  "NSURL",
  "NSUUID",
  "NSValue",
] }
objc2-app-kit = { version = "0.3.2", features = [
  "NSAppearance",
  "NSApplication",
  "NSBitmapImageRep",
  "NSDockTile",
  "NSImage",
  "NSImageRep",
  "NSResponder",
  "NSSound",
  "NSView",
] }
objc2-user-notifications = { version = "0.3.2", features = [
  "UNNotification",
  "UNNotificationContent",
  "UNNotificationRequest",
  "UNNotificationResponse",
  "UNNotificationSettings",
  "UNNotificationTrigger",
  "UNUserNotificationCenter",
  "block2",
] }
objc2-web-kit = { version = "0.3.2", features = [
  "WKHTTPCookieStore",
  "WKSnapshotConfiguration",
  "WKWebView",
  "WKWebsiteDataRecord",
  "WKWebsiteDataStore",
  "WKWebViewConfiguration",
  "block2",
  "objc2-app-kit",
] }
objc2-core-foundation = { version = "0.3.2", features = [
  "CFDictionary",
  "CFNumber",
  "CFString",
  "CFBase",
] }
objc2-core-video = { version = "0.3.2", features = [
  "CVBase",
  "CVBuffer",
  "CVImageBuffer",
  "CVPixelBuffer",
  "CVPixelBufferIOSurface",
  "CVPixelBufferPool",
  "CVReturn",
] }
objc2-core-media = { version = "0.3.2", features = [
  "CMBase",
  "CMBlockBuffer",
  "CMFormatDescription",
  "CMSampleBuffer",
  "CMTime",
  "CMTimeRange",
] }
objc2-video-toolbox = { version = "0.3.2", default-features = false, features = [
  "std",
  "VTBase",
  "VTErrors",
  "VTSession",
  "VTDecompressionSession",
  "VTDecompressionProperties",
  "VTPixelRotationSession",
  "VTPixelRotationProperties",
  "objc2-core-media",
  "objc2-core-video",
] }
objc2-av-foundation = { version = "0.3.2", default-features = false, features = [
  "std",
  "AVPlayer",
  "AVPlayerItem",
  "AVPlayerItemOutput",
  "AVTime",
  "objc2-core-media",
  "objc2-core-video",
] }

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "=2.0.2", features = ["v2_38"] }
webkit2gtk-sys = "2.0"
soup = { package = "soup3", version = "0.5" }
notify-rust = "4.18.2"
openh264 = "0.9"
gstreamer = "0.25"
gstreamer-app = "0.25"
gstreamer-video = "0.25"

[patch.crates-io]
gpui-pre = { path = "vendor/gpui-pre" }
gpui-pre-apple = { path = "vendor/gpui-pre-apple" }
gpui-pre-wgpu = { path = "vendor/gpui-pre-wgpu" }

[profile.dev.package.openh264-sys2]
opt-level = 3

[profile.dev.package.openh264]
opt-level = 3

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = true
